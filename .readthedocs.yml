# Read the Docs configuration file
# See https://docs.readthedocs.io/en/stable/config-file/v2/

version: 2

# Python dependencies
python:
  install:
    - method: pip
      path: .
      extra_requirements:
        - dev

# Build environment
build:
  os: ubuntu-22.04
  tools:
    python: '3.11'

# Sphinx configuration
sphinx:
  configuration: docs/source/conf.py
  # Fail on warnings to catch issues early
  fail_on_warning: false

# Documentation formats to build
formats:
  - pdf
  - epub
  - htmlzip

# Search configuration
search:
  ignore:
    - /search
    - /404
    - /sitemap.xml

# Redirects (useful for migrations)
redirects: {}
