[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micropyzzotmet"
version = "0.1.4"
description = "Lightweight Python package for meteorological downscaling over complex terrain"
readme = "README.md"
requires-python = ">=3.11,<3.14"
license = { text = "MIT" }
authors = [
  { name = "Riccardo Barella" }
]

dependencies = [
  "numpy>=2.3.0,<2.5",
  "pandas==2.3.3",
  # Zarr v3-compatible xarray; last xarray release supporting Python 3.11.
  "xarray==2026.9.0",
  "rasterio==1.4.3",
  # Keep this version to retain Python 3.11 compatibility.
  "rioxarray==0.19.0",
  "pyproj==3.7.2",
  "scipy==1.15.3",
  "pvlib==0.15.0",
  "netCDF4==1.7.4",
  "joblib==1.5.3",
  "tqdm==4.67.3",
  "affine==2.4.0",
  "matplotlib==3.10.8",
  # Zarr 3.1.x supports Python 3.11; Zarr >= 3.2 requires Python >= 3.12.
  "zarr==3.1.6",
  "numcodecs==0.16.5",
  "fsspec==2026.2.0",
  "s3fs==2026.2.0",
  # Needed explicitly for Earth Data Hub HTTPS access via fsspec.
  "aiohttp>=3.10,<4",
  "dask[array]==2026.3.0"
]

[project.optional-dependencies]
docs = [
  "sphinx>=7.0",
  "sphinx-rtd-theme>=1.3",
  "sphinx-autodoc-typehints>=1.24",
  "sphinx-copybutton>=0.5"
]

[dependency-groups]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff",
  "build"
]

[project.scripts]
micropyzzotmet = "micropyzzotmet.cli:main"

[tool.setuptools]
package-dir = { "" = "src" }

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
micropyzzotmet = ["auxiliary_data/*.nc"]