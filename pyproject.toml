[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "micropyzzotmet"
version = "0.1.4"
description = "Lightweight Python package for meteorological downscaling over complex terrain"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [
  { name = "Riccardo Barella" }
]
dependencies = [
  "numpy==2.2.5",
  "pandas==2.3.3",
  "xarray==2025.4.0",
  "rasterio==1.4.4",
  "rioxarray==0.19.0",
  "pyproj==3.7.2",
  "scipy==1.15.3",
  "pvlib==0.15.0",
  "netCDF4==1.7.4",
  "joblib==1.5.3",
  "tqdm==4.67.3",
  "affine==2.4.0",
  "matplotlib==3.10.8",
  "zarr==2.18.3",
  "numcodecs==0.15.1",
  "fsspec==2026.2.0",
  "s3fs==2026.2.0",
  "dask==2026.3.0"
]

[project.optional-dependencies]
dev = [
  "pytest>=8",
  "pytest-cov>=5",
  "ruff",
  "build"
]
docs = [
  "sphinx>=7.0",
  "sphinx-rtd-theme>=1.3",
  "sphinx-autodoc-typehints>=1.24",
  "sphinx-copybutton>=0.5"
]

[project.scripts]
micropyzzotmet = "micropyzzotmet.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
micropyzzotmet = ["auxiliary_data/*.nc"]